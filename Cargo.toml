[package]
name = "kip"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "kip"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
git2 = "0.19"
glob = "0.3"
regex = "1"
semver = "1"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
